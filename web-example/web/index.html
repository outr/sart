<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sart Web-lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Load Roboto NON-render-blocking: an unreachable/slow font host (offline
       old TVs, sandboxes) must never block first paint. Falls back to the
       system font stack in styles.css until (if) it arrives. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"></noscript>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <noscript>This app requires JavaScript.</noscript>
  <div id="app"></div>
  <!-- Tiny host runtime (Deferred/Xhr/Random/Timer) — NOT part of the app bundle. -->
  <script src="sart-runtime.js"></script>
  <!-- The Sart-emitted ES5 app. -->
  <script src="app.js"></script>
</body>
</html>
