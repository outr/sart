# Satellite manifest: flutter/services types that material.dart does not
# export. Regenerated alongside the main set by `sbt sartFacadesRegen`.

package flutter.services
import package:flutter/services.dart
out src/main/scala/flutter/services_generated.scala

file packages/flutter/lib/src/services/autofill.dart
keep AutofillHints
file packages/flutter/lib/src/services/text_input.dart
keep TextInput TextInputAction TextInputType
file packages/flutter/lib/src/services/mouse_cursor.dart
keep SystemMouseCursors
file packages/flutter/lib/src/services/text_formatter.dart
keep TextInputFormatter
file packages/flutter/lib/src/services/text_editing.dart
keep TextSelection
file packages/flutter/lib/src/services/hardware_keyboard.dart
keep KeyEvent KeyDownEvent KeyRepeatEvent
file packages/flutter/lib/src/services/keyboard_key.g.dart
keep LogicalKeyboardKey
file packages/flutter/lib/src/services/clipboard.dart
keep Clipboard ClipboardData
