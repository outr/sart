# Facade-generation manifest for the Flutter material facade set.
#
# Regenerate with:  sbt sartFacadesRegen   (needs FLUTTER_ROOT or dart on PATH)
#
# `curated` names stay hand-written in material.scala — they carry semantic
# choices the generator can't make (Option-mapped AsyncSnapshot, the
# State[W] type parameter, pubspec annotations on Widget). Everything else
# is generated from the real SDK sources into material_generated.scala.
# `file` paths resolve against FLUTTER_ROOT.

package flutter.material
import package:flutter/material.dart
out src/main/scala/flutter/material_generated.scala

curated Widget StatelessWidget StatefulWidget BuildContext Key
curated NavigatorState Navigator
curated ImageProvider NetworkImage AssetImage TextEditingController
curated-generic State/1 Route/1 MaterialPageRoute/1 AsyncSnapshot/1

# ── dart:ui (via the sky_engine stub package) ─────────────────────────────
file bin/cache/pkg/sky_engine/lib/ui/ui.dart
keep Color Offset FontWeight Brightness Size

# ── painting ──────────────────────────────────────────────────────────────
file packages/flutter/lib/src/painting/text_style.dart
keep TextStyle
file packages/flutter/lib/src/painting/border_radius.dart
keep BorderRadius BorderRadiusGeometry
file packages/flutter/lib/src/painting/box_shadow.dart
keep BoxShadow
file packages/flutter/lib/src/painting/box_decoration.dart
keep BoxDecoration
file packages/flutter/lib/src/painting/decoration.dart
keep Decoration
file packages/flutter/lib/src/painting/edge_insets.dart
keep EdgeInsets EdgeInsetsGeometry
file packages/flutter/lib/src/painting/alignment.dart
keep Alignment AlignmentGeometry

